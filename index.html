<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Steven's Brickworld</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#dfe3e8 repeating-linear-gradient(45deg,#e4e8ec 0 8px,#dde1e6 8px 16px);font:12px Verdana,Geneva,Tahoma,sans-serif;color:#222}
a{color:#0b4fb3;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
#site{max-width:970px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 10px rgba(0,0,0,.25)}
body.ingame{overflow:hidden;background:#000}
body.ingame #site{display:none}
#hdr{height:64px;background:linear-gradient(#4a8be0,#1f56a8);display:flex;align-items:center;padding:0 14px;gap:14px;border-bottom:2px solid #123d7c}
#hdr .logo{font:900 26px "Arial Black",Arial,sans-serif;color:#fff;text-shadow:2px 2px 0 #b8241b,3px 3px 0 #000;letter-spacing:-.5px;cursor:pointer;white-space:nowrap}
#hdr .logo span{color:#ffd23f}
#hdr .right{margin-left:auto;color:#fff;text-align:right;font-size:11px;line-height:1.5}
#hdr .right b{font-size:12px}
.studs{display:inline-flex;align-items:center;gap:4px;background:#fff8d6;color:#6b5200;border:1px solid #c9a227;border-radius:3px;padding:1px 6px;font-weight:bold}
.studs i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#e2b100 60%,#a37d00);display:inline-block}
#nav{background:#0d3c7f;display:flex;flex-wrap:wrap;border-bottom:3px solid #ffd23f}
#nav a{color:#fff;font-weight:bold;padding:7px 15px;border-right:1px solid #2a5aa3;font-size:12px}
#nav a:hover,#nav a.on{background:#2a5aa3;text-decoration:none}
#page{padding:14px;display:flow-root}
#foot{border-top:1px solid #ccc;padding:10px;text-align:center;color:#888;font-size:10px}
.box{border:1px solid #a9b4c2;background:#fff;margin-bottom:12px}
.box>h2{margin:0;font:bold 13px Verdana,sans-serif;color:#18325a;background:linear-gradient(#f2f6fb,#d4e0f0);border-bottom:1px solid #a9b4c2;padding:5px 9px}
.box .in{padding:10px}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols>.l{flex:1 1 300px}.cols>.r{flex:0 1 300px;min-width:240px}
.btn{display:inline-block;border:1px solid #1d4d92;background:linear-gradient(#5d9cec,#2c6bc6);color:#fff;font:bold 12px Verdana;padding:4px 12px;border-radius:3px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{filter:grayscale(1);opacity:.6;cursor:default}
.btn.green{border-color:#2b6b16;background:linear-gradient(#6fd14c,#36921b)}
.btn.big{font-size:16px;padding:8px 26px}
.btn.gray{border-color:#888;background:linear-gradient(#f4f4f4,#cfcfcf);color:#333}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid #c3cbd6;padding:6px;text-align:center;background:#fafbfc}
.card img,.card canvas{width:100%;aspect-ratio:1;background:#e9edf2;border:1px solid #d5dbe3;display:block}
.card .nm{font-weight:bold;margin:5px 0 2px;color:#0b4fb3}
.card .pr{color:#6b5200;font-size:11px}
.card.on{outline:3px solid #36921b}
.gcard{border:1px solid #c3cbd6;background:#fafbfc;padding:6px;width:200px}
.gcard canvas{width:100%;height:auto;border:1px solid #9aa6b5;display:block;cursor:pointer}
.gcard .nm{font-weight:bold;font-size:13px;margin:5px 0 1px}
.gcard .meta{color:#666;font-size:10px;margin-bottom:5px}
.banner{background:#fff8d6;border:1px solid #e0c35a;padding:8px 10px;margin-bottom:12px;color:#6b5200}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.friend{width:86px;text-align:center;font-size:11px}
.friend img{width:70px;height:70px;border:1px solid #c3cbd6;background:#e9edf2;display:block;margin:0 auto 3px}
.friend .st{color:#36921b;font-size:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid #a9b4c2;margin-bottom:10px}
.tabs a{padding:5px 12px;border:1px solid #a9b4c2;border-bottom:0;background:#e8edf4;font-weight:bold;color:#18325a}
.tabs a.on{background:#fff;margin-bottom:-1px;padding-bottom:6px}
#preview{width:100%;max-width:300px;height:340px;background:linear-gradient(#cfe0f5,#f0f4fa);border:1px solid #a9b4c2;display:block;cursor:grab}
.bodyfig{position:relative;width:150px;height:170px;margin:4px auto 10px}
.bodyfig div{position:absolute;border:2px solid #444;cursor:pointer}
.bodyfig div.sel{border-color:#ffd23f;box-shadow:0 0 0 2px #1f56a8}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:260px;margin:0 auto}
.palette div{aspect-ratio:1;border:1px solid #555;cursor:pointer}
.palette div:hover{outline:2px solid #1f56a8}
.news li{margin-bottom:6px}
input.txt{border:1px solid #8a99ad;padding:4px 6px;font:12px Verdana}
.small{font-size:10px;color:#777}
table.stats td{padding:2px 10px 2px 0}
/* ===== game ===== */
#game{position:fixed;inset:0;z-index:50;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#game canvas{display:block}
#game .overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);color:#fff;font:bold 13px Arial,sans-serif;text-shadow:0 0 3px #000,0 0 2px #000;white-space:nowrap}
.bubbles{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px}
.bubble{background:#fff;color:#222;font:bold 13px Arial,sans-serif;padding:6px 11px;border-radius:12px;max-width:220px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.25);position:relative;transition:opacity .6s;word-wrap:break-word}
.bubble:last-child::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.old{opacity:.75}
.gtop{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(15,15,15,.72);display:flex;align-items:center;gap:4px;padding:0 6px;z-index:5}
.gtop button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font:bold 12px Arial;padding:3px 10px;cursor:pointer;border-radius:2px}
.gtop button:hover{background:rgba(255,255,255,.25)}
.gtop .ttl{color:#fff;font:bold 12px Arial;margin-left:8px;opacity:.85}
.gtop .studs{margin-left:auto}
.chatlog{position:absolute;top:38px;left:10px;width:min(380px,70vw);max-height:36vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font:bold 14px Arial,sans-serif;color:#fff;text-shadow:1px 1px 2px #000,0 0 2px #000;z-index:4;pointer-events:none}
.chatlog div{margin:1px 0;line-height:1.3}.chatlog .sys{color:#ffe66b}
.chatbar{position:absolute;left:10px;bottom:12px;z-index:6}
.chatbar input{width:min(330px,60vw);padding:8px 10px;border:2px solid #444;border-radius:4px;background:rgba(255,255,255,.92);font:bold 14px Arial;outline:none}
.board{position:absolute;top:38px;right:10px;width:200px;background:rgba(25,25,25,.72);color:#fff;border-radius:3px;font:bold 13px Arial,sans-serif;z-index:4}
.board .hd,.board li{display:flex;justify-content:space-between;padding:3px 9px}
.board .hd{background:rgba(0,0,0,.45);padding:5px 9px}
.board ul{list-style:none;margin:0;padding:3px 0}
.board li.me{color:#ffd23f}
.board .ctl{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;border-top:1px solid rgba(255,255,255,.15);font-size:12px}
.board button{background:#2b7de9;color:#fff;border:0;border-radius:3px;font:bold 13px Arial;padding:1px 8px;cursor:pointer}
.ghelp{position:absolute;right:10px;bottom:12px;background:rgba(25,25,25,.75);color:#eee;font:12px Arial,sans-serif;padding:8px 10px;border-radius:3px;line-height:1.55;z-index:4;max-width:240px}
.ghelp b{color:#ffd23f}
.stage{position:absolute;top:38px;left:50%;transform:translateX(-50%);background:rgba(25,25,25,.72);color:#fff;font:bold 15px Arial;padding:5px 14px;border-radius:3px;z-index:4}
.toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);font:900 34px "Arial Black",Arial;color:#ffd23f;text-shadow:3px 3px 0 #b8241b,4px 4px 0 #000;z-index:7;pointer-events:none;transition:opacity .8s;text-align:center}
.jumpbtn{position:absolute;right:22px;bottom:90px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);color:#fff;font:bold 14px Arial;display:none;z-index:6}
.stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);display:none;z-index:6;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.6)}
.loadscr{position:absolute;inset:0;background:#2c2c2c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 28px "Arial Black",Arial;z-index:9;gap:10px;text-shadow:3px 3px 0 #b8241b}
.loadscr small{font:bold 13px Arial;color:#aaa;text-shadow:none}

.adm{background:#ffd23f;color:#5a3f00;font-size:9px;font-weight:bold;padding:1px 4px;border-radius:2px;vertical-align:middle}
table.form td{padding:4px 6px 4px 0}
table.list{border-collapse:collapse;width:100%}table.list th,table.list td{border-bottom:1px solid #dde3ea;padding:5px 6px;text-align:left}table.list th{background:#eef3f9;font-size:11px}
.motd{background:#e6f0ff;border:1px solid #8fb2e6;padding:8px 10px;margin-bottom:12px;color:#18325a}
.launcher{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.lwin{width:380px;max-width:92vw;background:#f4f6f9;border:1px solid #333;box-shadow:0 8px 30px rgba(0,0,0,.5);font:12px Verdana}
.ltitle{background:linear-gradient(#4a8be0,#1f56a8);color:#fff;font-weight:bold;padding:5px 8px}
.lbody{padding:18px 20px;text-align:center}
.llogo{font:900 24px "Arial Black",Arial;color:#1f56a8;text-shadow:2px 2px 0 #ffd23f;margin-bottom:12px}
.lmsg{margin-bottom:8px;font-weight:bold;color:#333}
.lbar{height:16px;border:1px solid #6b7c93;background:#fff;margin:0 0 8px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#36921b 0 10px,#4fb52b 10px 20px);transition:width .5s}
.lbody .btn{margin-top:10px}
#studio{position:fixed;inset:0;z-index:50;background:#d6dbe2;font:12px Verdana,sans-serif;user-select:none}
#studio canvas{position:absolute;left:170px;right:240px;top:34px;bottom:22px;width:calc(100% - 410px)!important;height:calc(100% - 56px)!important}
#studio .sbar{position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(#f7f8fa,#d9dee6);border-bottom:1px solid #8a97a8;display:flex;align-items:center;gap:3px;padding:0 6px}
#studio .slogo{color:#1f56a8;margin-right:10px;white-space:nowrap}
#studio .sbar button{font:12px Verdana;border:1px solid #9aa6b5;background:linear-gradient(#fff,#e3e7ed);padding:3px 8px;border-radius:2px;cursor:pointer;white-space:nowrap}
#studio .sbar button.on{background:#cfe0ff;border-color:#2b6bc6}
#studio .sbar button.g{background:linear-gradient(#6fd14c,#36921b);color:#fff;border-color:#2b6b16;font-weight:bold}
#studio .sep{width:1px;height:20px;background:#9aa6b5;margin:0 4px}
#studio .smsg{margin-left:8px;color:#36921b;font-weight:bold}
#studio .sexp,#studio .sprop{position:absolute;top:34px;bottom:22px;background:#f4f6f9;overflow:auto}
#studio .sexp{left:0;width:170px;border-right:1px solid #8a97a8}
#studio .sprop{right:0;width:240px;border-left:1px solid #8a97a8}
#studio .sh{background:linear-gradient(#f2f6fb,#d4e0f0);border-bottom:1px solid #a9b4c2;padding:4px 7px;font-weight:bold;color:#18325a}
#studio .slist div{padding:2px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#studio .slist div:hover{background:#e3ecf8}#studio .slist div.sel{background:#2b6bc6;color:#fff}
#studio .spbody{padding:6px 8px}
#studio .spbody label{display:block;margin:6px 0 2px;color:#444;font-weight:bold;font-size:11px}
#studio .spbody input[type=number],#studio .spbody input[type=text],#studio .spbody textarea,#studio .spbody select{width:100%;font:12px Verdana;border:1px solid #8a99ad;padding:2px 4px}
#studio .xyz{display:flex;gap:3px}#studio .xyz input{width:33%!important}
#studio .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}#studio .pal div{aspect-ratio:1;border:1px solid #555;cursor:pointer}
#studio .shint{position:absolute;left:0;right:0;bottom:0;height:22px;background:#e8ebf0;border-top:1px solid #8a97a8;padding:3px 8px;color:#555;font-size:11px;white-space:nowrap;overflow:hidden}
@media (pointer:coarse){.jumpbtn{display:block}.ghelp{display:none}}
@media (max-width:600px){#hdr .logo{font-size:19px}#nav a{padding:6px 9px}}
</style>
</head>
<body>
<div id="site">
  <div id="hdr"><div class="logo" onclick="location.hash='home'"><span id="ownerName">Steven</span>'s Brickworld</div>
    <div class="right" id="hdrRight"></div></div>
  <div id="nav"></div>
  <div id="page"></div>
  <div id="foot">Steven's Brickworld · a private fan-made brick game · Not affiliated with any other game company</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const page=$('#page');
if(!window.THREE){page.innerHTML='<div class="box"><h2>Uh oh</h2><div class="in">The 3D engine could not load. Check your connection and refresh.</div></div>';return;}

// ================= helpers =================
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function nameColor(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360},85%,68%)`;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ================= Claude (real AI chat) =================
let SAMPLE=null,aiPausedUntil=0;
(function initAI(tries){
  if(window.claude&&claude.use){claude.use('sample').then(s=>{SAMPLE=s||null;}).catch(()=>{});return;}
  if(tries<20)setTimeout(()=>initAI(tries+1),500);
})(0);
const aiReady=()=>SAMPLE&&Date.now()>aiPausedUntil;
const PERSONALITIES=['hyper and funny, uses caps when excited','chill and a little sarcastic','super nice and helpful, loves building','competitive, likes to brag but is a good sport','kinda shy, says lol a lot','goofy, makes random jokes','curious, asks lots of questions','obsessed with obbies and parkour','a show-off who loves cool hats','friendly and chatty, loves making new friends'];
function personality(n){let h=7;for(const c of n)h=(h*33+c.charCodeAt(0))>>>0;return PERSONALITIES[h%PERSONALITIES.length];}

// ================= catalog =================
const ITEMS=[
 {id:'hat_none',type:'hat',name:'No Hat',price:0},
 {id:'hat_hair',type:'hat',name:'Brown Hair',price:10},
 {id:'hat_cap',type:'hat',name:'Red Ball Cap',price:15},
 {id:'hat_party',type:'hat',name:'Party Hat',price:20},
 {id:'hat_top',type:'hat',name:'Classic Top Hat',price:30},
 {id:'hat_cone',type:'hat',name:'Traffic Cone',price:40},
 {id:'hat_phones',type:'hat',name:'Headphones',price:45},
 {id:'hat_viking',type:'hat',name:'Viking Helm',price:60},
 {id:'hat_beanie',type:'hat',name:'Cozy Beanie',price:15},
 {id:'hat_bucket',type:'hat',name:'Bucket Hat',price:20},
 {id:'hat_brick',type:'hat',name:'Brick Head',price:35},
 {id:'hat_wizard',type:'hat',name:'Wizard Hat',price:50},
 {id:'hat_chef',type:'hat',name:'Chef Hat',price:25},
 {id:'hat_fedora',type:'hat',name:'Classic Fedora',price:35},
 {id:'hat_pumpkin',type:'hat',name:'Pumpkin Head',price:80},
 {id:'hat_halo',type:'hat',name:'Golden Halo',price:120},
 {id:'hat_crown',type:'hat',name:'Golden Crown',price:150},
 {id:'face_smile',type:'face',name:'Smile',price:0},
 {id:'face_sleepy',type:'face',name:'Sleepy',price:15},
 {id:'face_wink',type:'face',name:'Wink',price:20},
 {id:'face_shock',type:'face',name:'Shocked',price:20},
 {id:'face_silly',type:'face',name:'Silly',price:25},
 {id:'face_grin',type:'face',name:'Big Grin',price:30},
 {id:'face_cool',type:'face',name:'Cool Shades',price:35},
 {id:'face_smirk',type:'face',name:'Smirk',price:15},
 {id:'face_angry',type:'face',name:'Angry',price:25},
 {id:'face_star',type:'face',name:'Starry Eyes',price:40},
 {id:'shirt_none',type:'shirt',name:'Plain',price:0},
 {id:'shirt_star',type:'shirt',name:'Star Tee',price:20},
 {id:'shirt_heart',type:'shirt',name:'Heart Tee',price:20},
 {id:'shirt_stripes',type:'shirt',name:'Stripes Tee',price:25},
 {id:'shirt_smiley',type:'shirt',name:'Smiley Tee',price:30},
 {id:'shirt_brick',type:'shirt',name:'Brick Tee',price:35},
 {id:'shirt_flame',type:'shirt',name:'Flame Tee',price:40},
];
const ITEM=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const PALETTE=['#f2f3f3','#e5e4df','#a3a2a5','#635f62','#1b2a35','#111111','#f5cd30','#ffcc99','#ead2b4','#c69c6d','#8d5524','#7c5c46','#5a4c42','#c4281c','#ff0000','#da8541','#e29b40','#ffd23f','#a4bd47','#4b974b','#287f47','#00a2ff','#0d69ac','#2b3990','#6b327c','#b480ff','#ff66cc','#ff98dc','#9ff3e9','#1abc9c','#e8bac8','#ffffff'];

// ================= save data =================
const KEY='brickworld_save_v1',ACC='brickworld_accounts_v1';
const DEFAULT={name:'',studs:100,owned:['hat_none','face_smile','shirt_none'],
  av:{head:'#f5cd30',torso:'#0d69ac',larm:'#f5cd30',rarm:'#f5cd30',lleg:'#a4bd47',rleg:'#a4bd47',hat:'hat_none',face:'face_smile',shirt:'shirt_none'},
  lastDaily:0,visits:{},wins:{},joined:Date.now(),played:0};
// ---- accounts (saved in this browser; passwords are stored hashed) ----
const freshSave=n=>Object.assign(JSON.parse(JSON.stringify(DEFAULT)),{name:n,joined:Date.now()});
let A=null;try{A=JSON.parse(localStorage.getItem(ACC));}catch(e){}
A=Object.assign({users:{},session:null,motd:'',settings:{},places:{}},A||{});
A.settings=Object.assign({aiChat:true,activity:1,mute:false},A.settings);
let legacy=null;try{legacy=JSON.parse(localStorage.getItem(KEY));}catch(e){}
let data=null;
const cur=()=>A.session&&A.users[A.session]?A.session:null;
const role=()=>cur()?A.users[cur()].role:null;
const isAdmin=()=>role()==='owner'||role()==='admin';
const isOwner=()=>role()==='owner';
function saveAll(){try{localStorage.setItem(ACC,JSON.stringify(A));}catch(e){}}
function save(){if(cur())A.users[cur()].save=data;saveAll();}
function loadUser(){
  if(!cur()){data=freshSave('Guest');return;}
  const u=A.users[cur()];data=Object.assign(freshSave(cur()),u.save||{});data.av=Object.assign({},DEFAULT.av,data.av);u.save=data;
}
async function hashPw(name,pw){const txt='brickworld|'+name.toLowerCase()+'|'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=0;for(const c of txt)h=(h*131+c.charCodeAt(0))>>>0;return 'x'+h.toString(16);}}
let dailyMsg='';
function onLogin(){loadUser();if(Date.now()-data.lastDaily>20*3600e3){data.studs+=25;data.lastDaily=Date.now();dailyMsg='Daily bonus! You got <b>25 Studs</b> for visiting today.';}save();}
const ownerKey=()=>Object.keys(A.users).find(k=>A.users[k].role==='owner')||null;
// the Owner stays signed in on this computer: no password needed
if(!cur()&&ownerKey()){A.session=ownerKey();saveAll();}
loadUser();if(cur())onLogin();
function worldName(){const o=Object.values(A.users).find(u=>u.role==='owner');return (o&&o.save&&o.save.name)||'Steven';}
function signOut(){save();A.session=null;saveAll();loadUser();location.hash='login';}

// ---- sounds (made with the Web Audio API, all original) ----
const SFX=(()=>{
  let ctx=null;
  const ac=()=>{if(A.settings.mute)return null;if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ctx.state==='suspended')ctx.resume();return ctx;};
  function tone(f,dur,type='sine',vol=.15,slide=0,delay=0){const c=ac();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);}
  function noise(dur,vol=.2,freq=800,delay=0){const c=ac();if(!c)return;const t=c.currentTime+delay;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource();src.buffer=buf;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=c.createGain();g.gain.value=vol;src.connect(f).connect(g).connect(c.destination);src.start(t);}
  return{
    step:(v=1)=>noise(.05,.12*v,600),
    jump:(v=1)=>tone(260,.16,'square',.05*v,420),
    land:(v=1)=>noise(.09,.22*v,260),
    die:(v=1)=>{noise(.3,.28*v,1400);tone(300,.35,'sawtooth',.06*v,-220);noise(.2,.2*v,500,.12);},
    coin:()=>{tone(988,.08,'square',.05);tone(1319,.18,'square',.05,0,.07);},
    chat:(v=1)=>tone(1100,.05,'sine',.05*v),
    click:()=>tone(640,.04,'square',.03),
    win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.06,0,i*.11)),
    place:()=>{noise(.06,.2,900);tone(180,.06,'square',.04);},
  };
})();

const HEAD_GEO=(()=>{const R=.62,H=.6,c=.2,pts=[new THREE.Vector2(0,-H)];
  for(let i=0;i<=8;i++){const a=-Math.PI/2+i/8*Math.PI/2;pts.push(new THREE.Vector2(R-c+Math.cos(a)*c,-H+c+Math.sin(a)*c));}
  for(let i=0;i<=8;i++){const a=i/8*Math.PI/2;pts.push(new THREE.Vector2(R-c+Math.cos(a)*c,H-c+Math.sin(a)*c));}
  pts.push(new THREE.Vector2(0,H));const g=new THREE.LatheGeometry(pts,28);g.computeVertexNormals();return g;})();

function makeAvatar(look){
  const L=c=>new THREE.MeshLambertMaterial({color:c});
  const group=new THREE.Group();
  const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),L(c));m.castShadow=true;return m;};
  const torso=box(2,2,1,look.torso);torso.position.y=3;group.add(torso);
  if(look.shirt&&look.shirt!=='shirt_none'){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.9),new THREE.MeshLambertMaterial({map:shirtTex(look.shirt),transparent:true}));p.position.set(0,3,.505);group.add(p);}
  const limb=(x,y,c)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=box(1,2,1,c);m.position.y=-1;p.add(m);group.add(p);return p;};
  const parts={lLeg:limb(-.5,2,look.lleg),rLeg:limb(.5,2,look.rleg),lArm:limb(-1.5,4,look.larm),rArm:limb(1.5,4,look.rarm)};
  const head=new THREE.Mesh(HEAD_GEO,L(look.head));head.position.y=4.62;head.castShadow=true;group.add(head);
  const face=new THREE.Mesh(FACE_GEO,new THREE.MeshLambertMaterial({map:faceTex(look.face||'face_smile'),transparent:true,alphaTest:.4}));face.position.y=4.62;group.add(face);
  group.add(hatMesh(look.hat));
  return Object.assign({group},parts);
}

const PLACES={
  hangout:{id:'hangout',name:'Classic Baseplate Hangout',desc:'Hang out on the old-school studded baseplate. Climb the blue tower, try the floating parkour, chill on the benches and meet new people.',maxAI:5},
  obby:{id:'obby',name:'Rainbow Sky Obby',desc:'36 stages of jumping across rainbow bricks in the sky. Watch out for red kill bricks! Checkpoints every 6 stages. Finish to earn 25 Studs.',maxAI:4},
};
const BOT_NAMES=['blockyben','starlight_kat','turbo_toast','mintyfresh09','captaincheese','glitchwizard','sunnyside_sam','frostbyte77','waffle_knight','echo_runner','lunarfox','brickbuilder3000','pixelpip','noodle_ninja','skyhopper','cosmic_carl','jellybean_jo','rocketmax'];
// consistent "friends" with fixed looks
const FRIENDS=BOT_NAMES.slice(0,8).map((n,i)=>{const r=mulberry32(i*977+5);const saveR=Math.random;Math.random=r;const look=randomLook();Math.random=saveR;return{name:n,look};});
const friendLook=n=>{const f=FRIENDS.find(f=>f.name===n);return f?f.look:null;};
const allPlaces=()=>Object.assign({},PLACES,A.places);
function hashStr(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return h;}
// AI players hop on and off on their own schedules. Each one has its own sessions, so the friends list and the servers agree.
const SLOT=7*60*1000;
function presence(name,t=Date.now()){
  const h=hashStr(name),slot=Math.floor((t+h%SLOT)/SLOT);
  const r=mulberry32(h^Math.imul(slot,2654435761|0))();
  const hr=new Date(t).getHours();
  const base=(hr>=15&&hr<23?.62:hr>=8&&hr<15?.42:.2)*(A.settings.activity||1);
  if(r>=base)return null;
  const ids=Object.keys(allPlaces());const w=ids.map(id=>id==='hangout'?3:id==='obby'?2:1.2);
  let x=mulberry32(h+Math.imul(slot,7919))()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<ids.length;i++){x-=w[i];if(x<0)return ids[i];}return ids[0];
}

function startPreview(cv){
  const w=cv.clientWidth||300,h=340;
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(w,h,false);
  const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x888888,.85));const d=new THREE.DirectionalLight(0xffffff,.55);d.position.set(4,8,6);s.add(d);
  const cam=new THREE.PerspectiveCamera(32,w/h,.1,100);cam.position.set(0,3.4,14);cam.lookAt(0,2.7,0);
  let av=null,yaw=-.45,drag=null,stop=false;
  const refresh=()=>{if(av)s.remove(av.group);av=makeAvatar(data.av);s.add(av.group);};refresh();
  cv.onpointerdown=e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(drag!==null){yaw+=(e.clientX-drag)*.012;drag=e.clientX;}};
  cv.onpointerup=()=>drag=null;
  const loop=()=>{if(stop)return;requestAnimationFrame(loop);if(drag===null)yaw+=.004;av.group.rotation.y=yaw;r.render(s,cam);};loop();
  return{refresh,stop(){stop=true;r.dispose();r.forceContextLoss&&r.forceContextLoss();}};
}

// ================= GAME =================
function startGame(place){
  data.visits[place.id]=(data.visits[place.id]||0)+1;save();
  const ac=new AbortController();const sig={signal:ac.signal};
  const timers=new Set();let stopped=false;

          if(ai.racing){ai.racing=false;if(b.pos.y>9)b.say(pick(LINES.win));else{ai.target.set(30,0,13);ai.racing=true;ai.t=15;ai.state='walk';return tmp.set(0,0,0);}}
          ai.state='idle';ai.t=rand(2,6);tmp.set(0,0,0);
        }
      }else if(ai.t<=0&&!ai.stay&&!isObby){
        const r=Math.random();ai.state='walk';ai.t=rand(8,14);
        if(r<.35)wanderTarget(ai.target);
        else if(r<.65){const a=rand(0,6.28),d=rand(5,9);ai.target.set(me.pos.x+Math.cos(a)*d,0,me.pos.z+Math.sin(a)*d);}
        else if(r<.8){const o=pick(bots().filter(x=>x!==b))||me;const a=rand(0,6.28);ai.target.set(o.pos.x+Math.cos(a)*5,0,o.pos.z+Math.sin(a)*5);}
        else if(r<.9){if(isHangout)ai.target.set(-22,0,26+rand(-1,1));else wanderTarget(ai.target);}
        else{ai.state='idle';ai.t=rand(2,5);}
      }else if(ai.state==='idle'&&ai.t<=0&&ai.stay)ai.stay=false;
      if(ai.state==='idle'&&b.pos.distanceTo(me.pos)<18&&b.spin<=0)b.yaw+=angDiff(b.yaw,Math.atan2(me.pos.x-b.pos.x,me.pos.z-b.pos.z))*Math.min(1,dt*4);
    }
    tmp.y=0;const l=tmp.length();if(l>.001)tmp.divideScalar(l);
    return tmp;
  }
  // population: AI players are on their own schedules. The ones "playing" this place are already here; others hop on and off over time.
  const jf=joinFriend;joinFriend=null;
  const scheduledHere=()=>BOT_NAMES.filter(n=>presence(n)===place.id&&n!==me.name);
  scheduledHere().slice(0,maxAI).forEach(n=>joinBot(n,true));
  if(jf&&!chars.find(c=>c.name===jf))joinBot(jf,true);
  if(bots().length<2)[2500,8000].forEach(ms=>T(()=>{if(bots().length<maxAI)joinBot();},ms));
  every(()=>{
    const want=new Set(scheduledHere()),bs=bots().filter(b=>!b.ai.leaving);
    const goers=bs.filter(b=>!want.has(b.name)&&!b.ai.follow);
    if(goers.length&&bs.length>1&&Math.random()<.55)leaveBot(pick(goers));
    const comers=[...want].filter(n=>!chars.find(c=>c.name===n));
    if(comers.length&&bots().length<maxAI)T(()=>{if(bots().length<maxAI)joinBot(pick(comers));},rand(500,9000));
    else if(bots().length<1&&Math.random()<.5)joinBot();
    else if(bots().length<maxAI&&Math.random()<.12)joinBot();
  },20000);
  // AI players start conversations on their own too
  every(()=>{
    if(!aiReady()||!A.settings.aiChat||aiBusy||Date.now()-lastAI<40000)return;
    const near=bots().filter(b=>!b.ai.leaving&&!b.dead&&b.pos.distanceTo(me.pos)<60);
    if(!near.length||Math.random()<.45)return;
    aiConverse([pick(near)],null);
  },15000);
  every(()=>{data.played++;addStuds(1);},60000);

  // ---- loop ----
  const clock=new THREE.Clock();const v=new THREE.Vector3();const pdir=new THREE.Vector3();const pv=new THREE.Vector3();
  let raf,playTime=0,autoShotDone=false,shotReq=null;
  function frame(){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(),.05);
    let f=0,s=0;
    if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD||keys.ArrowRight)s+=1;if(keys.KeyA||keys.ArrowLeft)s-=1;
    f-=stick.y;s+=stick.x;
    const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    pdir.set(fx*f+rx*s,0,fz*f+rz*s);if(pdir.length()>1)pdir.normalize();
    step(me,dt,pdir,keys.Space||touchJump);animate(me,dt);
    for(const b of bots()){
      const d=botThink(b,dt).clone();
      let jump=b.ai.wantJump;if(b.ai.jumpNow>0&&b.grounded){jump=true;b.ai.jumpNow--;}
      if(!isObby&&!b.ai.follow&&b.ai.state==='idle'&&Math.random()<dt*.04)jump=true;
      const moved=step(b,dt,d,jump);
      if(!b.dead&&d.lengthSq()>.01&&b.grounded&&moved<dt*13*.3){b.ai.blocked+=dt;if(b.ai.blocked>.25){b.vel.y=JUMPV;b.grounded=false;b.ai.blocked=0;if(!isObby&&Math.random()<.3)b.ai.target.set(b.pos.x+rand(-15,15),0,b.pos.z+rand(-15,15));}}
      else b.ai.blocked=0;
      animate(b,dt);
    }
    if(PHYS){
      for(const c of chars)if(c.body&&!c.dead){c.body.position.set(c.pos.x,c.pos.y+2.6,c.pos.z);c.body.velocity.set(c.vel.x,c.grounded?0:c.vel.y,c.vel.z);c.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),c.yaw);}
      world.step(1/60,dt,4);
      for(let i=dyn.length-1;i>=0;i--){const d=dyn[i];d.m.position.copy(d.b.position);d.m.quaternion.copy(d.b.quaternion);
        if(d.life!==Infinity){d.life-=dt;if(d.life<=0){scene.remove(d.m);d.m.geometry.dispose();world.removeBody(d.b);dyn.splice(i,1);}}
        else if(d.b.position.y<-60){d.b.position.y=-1000;d.b.sleep&&d.b.sleep();}}
    }
    for(let i=debris.length-1;i>=0;i--){const p=debris[i];p.t-=dt;p.v.y-=GRAV*.6*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.r.x*dt;p.m.rotation.y+=p.r.y*dt;if(p.t<=0){scene.remove(p.m);p.m.geometry.dispose();debris.splice(i,1);}}
    const tgt=v.copy(me.pos);tgt.y+=4.5;
    camera.position.set(tgt.x+Math.sin(camYaw)*Math.cos(camPitch)*camDist,tgt.y+Math.sin(camPitch)*camDist,tgt.z+Math.cos(camYaw)*Math.cos(camPitch)*camDist);
    if(BASE&&camera.position.y<.5)camera.position.y=.5;
    camera.lookAt(tgt);
    sun.position.set(me.pos.x+40,me.pos.y+80,me.pos.z+25);sun.target.position.copy(me.pos);
    renderer.render(scene,camera);
    playTime+=dt;
    if(!shotReq&&!autoShotDone&&playTime>4){autoShotDone=true;let has=null;try{has=localStorage.getItem('bw_thumb_'+place.id);}catch(e){}if(!has)shotReq='auto';}
    if(shotReq){const mode=shotReq;shotReq=null;const tc=document.createElement('canvas');tc.width=360;tc.height=220;const src=renderer.domElement,sw=src.width,sh=src.height,ar=360/220;let w=sw,h=sw/ar;if(h>sh){h=sh;w=sh*ar;}
      tc.getContext('2d').drawImage(src,(sw-w)/2,(sh-h)/2,w,h,0,0,360,220);try{localStorage.setItem('bw_thumb_'+place.id,tc.toDataURL('image/jpeg',.85));if(mode==='manual')toast('📷 Thumbnail saved!');}catch(e){if(mode==='manual')toast('Could not save thumbnail');}}
    const W=innerWidth,Hh=innerHeight;
    for(const c of chars){
      pv.set(c.pos.x,c.pos.y+6,c.pos.z).project(camera);
      const dist=camera.position.distanceTo(c.pos);const vis=pv.z<1&&pv.z>-1&&dist<160&&!c.dead;
      const x=(pv.x+1)/2*W,y=(1-pv.y)/2*Hh;
      c.tag.style.display=vis&&c!==me?'block':'none';c.bub.style.display=vis?'flex':'none';
      if(vis){c.tag.style.left=x+'px';c.tag.style.top=y+'px';const sc=clamp(28/dist,.55,1.1);
        c.bub.style.left=x+'px';c.bub.style.top=(y-(c===me?0:18))+'px';c.bub.style.transform=`translate(-50%,-100%) scale(${sc})`;c.bub.style.transformOrigin='50% 100%';}
    }
  }
  refreshBoard();
  sys(`Welcome to ${place.name}!`);
  if(isObby)sys('Reach the golden pad at the end. Red bricks = instant death!');
  T(()=>{const l=q('.loadscr');l&&l.remove();},700);
  frame();
  return{stop(){stopped=true;cancelAnimationFrame(raf);ac.abort();timers.forEach(clearTimeout);intervals.forEach(clearInterval);renderer.dispose();renderer.forceContextLoss&&renderer.forceContextLoss();root.remove();updateHdr();}};
}

updateHdr();route();
})();
</script>
